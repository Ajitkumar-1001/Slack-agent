[project]
name = "flowpilot-ai"
version = "0.1.0"
description = "Add your description here"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.1",
    "alembic>=1.18.4",
    "anthropic>=0.116.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.138.0",
    "google-auth>=2.47.0",
    "httpx>=0.28.1",
    "langchain-core>=1.4.8",
    "langgraph>=1.2.6",
    "orjson>=3.11.9",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "slack-bolt>=1.28.0",
    "slack-sdk>=3.42.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pyright>=1.1.410",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.19",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov=slack --cov=agents --cov=workflows --cov=tools --cov=db --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
